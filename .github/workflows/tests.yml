name: Tests

on:
  push:
  pull_request:

jobs:
  testen:
    runs-on: ubuntu-latest
    steps:
      - name: Code Ophalen
        uses: actions/checkout@v4
      - name: Installeer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Requirements installeren
        run: pip install -r requirements.txt
      - name: Tests draaien
        run: pytest -v
